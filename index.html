<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e8">
  <title>Питта Эллас</title>
  <meta name="description" content="Автоматизированное производство традиционной греческой питы полного цикла.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="logo" href="#top" aria-label="Питта Эллас, на главную">
        <img src="assets/logo.svg" alt="Питта Эллас">
      </a>

      <div class="header__right">
        <nav class="nav" aria-label="Основная навигация">
          <a class="is-current" href="#top">Главная</a>
          <a href="#contacts">Контакты</a>
          <a href="#products">Продукция</a>
          <a href="#production">Производство</a>
        </nav>
        <div class="language" aria-label="Выбор языка">
          <button class="is-active" type="button" aria-pressed="true">RU</button>
          <span></span>
          <button type="button" aria-pressed="false">EN</button>
        </div>
      </div>

      <button class="menu-button" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-menu">
        <span></span><span></span>
      </button>

      <nav class="mobile-menu" id="mobile-menu" aria-label="Мобильная навигация">
        <a href="#top">Главная</a>
        <a href="#contacts">Контакты</a>
        <a href="#products">Продукция</a>
        <a href="#production">Производство</a>
      </nav>
    </div>
  </header>

  <main class="hero" id="top">
    <div class="hero__slider" aria-label="Продукция Питта Эллас">
      <div class="hero__track">
        <div class="hero__slide is-active">
          <img src="assets/hero-pita-v2.png" alt="Свежая традиционная греческая пита" fetchpriority="high">
        </div>
        <div class="hero__slide" aria-hidden="true">
          <img src="assets/hero-pita-v2.png" alt="">
        </div>
      </div>
    </div>
    <div class="hero__shade" aria-hidden="true"></div>
    <div class="hero__grain" aria-hidden="true"></div>

    <div class="slider-controls" aria-label="Управление слайдером">
      <button class="slider-arrow slider-arrow--prev" type="button" aria-label="Предыдущий слайд">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <button class="slider-arrow slider-arrow--next" type="button" aria-label="Следующий слайд">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>

    <section class="hero__content" aria-labelledby="hero-title">
      <h1 id="hero-title">
        <span class="title-brand">Питта Эллас</span>
        <span class="title-rank"><b>№1</b><span>в России</span></span>
        <span class="title-production">по производству</span>
        <span class="title-product">греческой питы</span>
      </h1>
      <p class="hero__lead">
        Автоматизированное производство полного цикла в Краснодарском крае.
        Основа вашего успешного бизнеса в сфере стрит-фуда и ресторанов.
      </p>

      <div class="hero__actions">
        <a class="button button--primary" href="#products">Продукция</a>
        <a class="button button--secondary" href="#partner">Стать партнером</a>
      </div>
    </section>
  </main>
  <script src="script.js?v=4"></script>
</body>
</html>
